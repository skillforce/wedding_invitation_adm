server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers ---
  add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options            "SAMEORIGIN"                          always;
  add_header X-Content-Type-Options     "nosniff"                             always;
  add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
  add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Per-request nonce via $request_id (32 hex chars, unique per request).
  # The Vite build stamps NONCE_PLACEHOLDER on every <script> and <link> tag;
  # sub_filter replaces it here before the response is sent.
  # If your API lives on a separate origin, add it to connect-src below.
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    always;

  # Replace the build-time placeholder with the per-request nonce.
  sub_filter_once off;
  sub_filter_types text/html;
  sub_filter "NONCE_PLACEHOLDER" "$request_id";

  # Vue Router (history mode) support
  location / {
    try_files $uri $uri/ /index.html;
  }
}